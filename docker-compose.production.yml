services:
  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    env_file:
      - ${SUNSEA_ENV_FILE:-.env}
    ports:
      - "127.0.0.1:${SUNSEA_BACKEND_PORT:-13001}:3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3001/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:${SUNSEA_FRONTEND_PORT:-13000}:3000"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
